<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0712">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="쇠질로그">
<title>쇠질로그 — 상체 집중 5분할</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    /* 신주쿠 퍼플 — 사이버펑크 */
    --bg:#0b0712; --bg-2:#120b1e; --panel:#160f26; --panel-2:#1e1533; --line:#2d2147; --well:#0e0818;
    --ink:#f0e9ff; --ink-dim:#a79bc4; --ink-faint:#6b5f88;
    --pur:#b14cff; --mag:#ff2bd6; --cyan:#2ee6ff; --lime:#c8ff3a;
    /* 요일 코드 (네온) */
    --plate-red:var(--mag); --plate-yellow:var(--pur); --plate-green:var(--cyan);
    --plate-white:var(--lime); --plate-blue:#ffb020;
    --amber:#ffb020; --done:var(--lime);
    --radius:14px;
    --tap:48px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  button,.chk,.grab,nav button,summary{touch-action:manipulation}
  html{font-size:16px; overflow-anchor:none}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 520px at -10% -10%, rgba(177,76,255,.22), transparent 60%),
      radial-gradient(720px 420px at 110% 110%, rgba(255,43,214,.14), transparent 60%);}
  body::after{content:""; position:fixed; inset:0; z-index:200; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px)}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

  /* ── 상단 고정바 (스크롤 시 블러) ───── */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(11,7,18,.72);
    -webkit-backdrop-filter:saturate(160%) blur(18px); backdrop-filter:saturate(160%) blur(18px);
    border-bottom:1px solid transparent;
    transition:border-color .25s, background .25s;
  }
  .topbar.scrolled{border-bottom-color:var(--line); background:rgba(11,7,18,.84)}
  .datebar{overflow:hidden; max-height:80px; transition:max-height .28s ease, opacity .2s, margin .28s}
  .topbar.scrolled .datebar{max-height:0; opacity:0; margin-top:0}
  .topbar.scrolled header{padding-bottom:4px}
  @supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .topbar{background:var(--bg)}
  }
  /* ── 헤더 ─────────────────────────── */
  header{padding:calc(20px + env(safe-area-inset-top)) 16px 8px; max-width:640px; margin:0 auto}
  .brand{display:flex; align-items:center; gap:12px}
  .brand .lockup{display:flex; flex-direction:column; gap:3px; min-width:0}
  .brand .hbtns{margin-left:auto; display:flex; gap:8px; flex:none}
  .brand h1{margin:0; line-height:1}
  .brand .logo{font-size:1.85rem; font-weight:900; font-style:italic; letter-spacing:-.045em; color:#fff;
    text-shadow:0 0 10px var(--pur), 0 0 28px rgba(177,76,255,.7)}
  .brand .logo u{text-decoration:none; color:var(--cyan); text-shadow:0 0 10px var(--cyan), 0 0 24px rgba(46,230,255,.6)}
  .brand .sub{color:var(--ink-faint); font-size:.8rem; font-weight:600; padding-bottom:6px}
  .brand .tag{color:var(--ink-dim); font-style:italic; font-weight:700; font-size:.8rem; letter-spacing:-.01em; line-height:1; white-space:nowrap; padding-left:2px}
  .brand .tag b{color:var(--lime); font-style:italic; text-shadow:0 0 8px rgba(200,255,58,.8)}
  .golfbtn{min-width:var(--tap); min-height:var(--tap); border-radius:12px; border:1px solid var(--line);
    background:var(--panel); font-size:1.25rem; cursor:pointer; touch-action:manipulation}
  .golfbtn:focus-visible{outline:2px solid var(--pur); outline-offset:2px}
  .elbowbtn{filter:grayscale(1) opacity(.55)}
  .elbowbtn.on{filter:none; border-color:var(--mag); box-shadow:0 0 14px rgba(255,43,214,.4), inset 0 0 12px rgba(255,43,214,.1)}
  .deload-banner.elbow{background:rgba(255,43,107,.07); border-left-color:#ff2b6b}
  .deload-banner.elbow b{color:#ff5c8a}
  .ex.skipped{opacity:.55; background:var(--panel)}
  .ex.skipped::before{background:var(--line)}
  .ex.skipped .ex-head .order{color:var(--ink-faint); text-shadow:none}
  .ex.skipped .cue{margin-bottom:14px}

  /* ── 샷 페이서 오버레이 ───────────────── */
  .golf{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
    padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); touch-action:manipulation}
  .golf[hidden]{display:none}
  .golf-top{display:flex; align-items:center; justify-content:space-between}
  .golf-title{font-weight:800; font-size:1.1rem}
  .golf-x{min-width:var(--tap); min-height:var(--tap); border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-size:1rem; cursor:pointer}
  .golf-cfg{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:4px 12px; margin:14px 0 0}
  .golf-cfg.lock{opacity:.45; pointer-events:none}
  .golf-interval{font-size:1.05rem}
  .golf-main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .golf-count{font-size:1.4rem; font-weight:800; color:var(--ink-dim)}
  .golf-count small{font-size:.9rem; font-weight:700; color:var(--ink-faint)}
  .golf-big{font-size:clamp(96px,34vw,160px); font-weight:900; line-height:1; margin:10px 0 6px; transition:color .15s}
  .golf-big.warn{color:var(--amber)}
  .golf-big.go{color:var(--lime); text-shadow:0 0 18px rgba(200,255,58,.7)}
  .golf-sub{color:var(--ink-dim); font-size:.95rem; font-weight:700; min-height:1.4em}
  .golf-elapsed{color:var(--ink-faint); font-size:.8rem; margin-top:10px}
  .golf.warn{background:#1c1210} .golf.go{background:#121a0a}
  .golf-btns{display:flex; gap:10px}
  .golf-btns button{flex:1; min-height:56px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); font:inherit; font-weight:800; font-size:1rem; cursor:pointer}
  .golf-btns button.primary{background:var(--lime); color:#0b1200; border-color:var(--lime); box-shadow:0 0 18px rgba(200,255,58,.45)}
  @keyframes golfPop{0%{transform:scale(.7)} 50%{transform:scale(1.15)} 100%{transform:scale(1)}}
  .golf-big.go{animation:golfPop .4s cubic-bezier(.34,1.45,.55,1)}
  @media (prefers-reduced-motion:reduce){ .golf-big.go{animation:none} }
  .datebar{display:flex; align-items:center; gap:8px; margin-top:10px}
  .datebar input[type=date]{
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 12px; font:inherit; min-height:var(--tap);
  }
  .weekchip{
    margin-left:auto; min-height:var(--tap); padding:0 6px 0 14px; border-radius:999px; cursor:pointer; touch-action:manipulation;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font:inherit; font-size:.78rem; font-weight:700; letter-spacing:-.01em;
    display:inline-flex; align-items:center; gap:10px; transition:background .2s, border-color .2s, color .2s;
  }
  .weekchip .wk{white-space:nowrap}
  .weekchip .sw{position:relative; width:38px; height:22px; border-radius:11px; background:var(--panel-2); border:1px solid var(--line); flex:none; transition:background .2s, border-color .2s}
  .weekchip .sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink-faint); transition:transform .22s cubic-bezier(.34,1.45,.55,1), background .2s}
  .weekchip.deload{background:rgba(255,43,214,.08); border-color:var(--mag); color:var(--mag);
    box-shadow:0 0 14px rgba(255,43,214,.35), inset 0 0 14px rgba(255,43,214,.08)}
  .weekchip.deload .sw{background:var(--mag); border-color:var(--mag); box-shadow:0 0 10px var(--mag)}
  .weekchip.deload .sw::after{transform:translateX(16px); background:#1a0a1f}
  .weekchip:focus-visible{outline:2px solid var(--pur); outline-offset:2px}
  .deload-banner{margin:10px 0 0; padding:12px 14px 12px 16px; border-radius:12px; background:rgba(255,43,214,.07); border-left:3px solid var(--mag); color:var(--ink-dim); font-size:.82rem; line-height:1.55}
  .deload-banner b{color:var(--mag)}

  /* ── 앱 내 다이얼로그 (confirm 대체) ─────────── */
  .dlg-bg{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center; padding:16px; opacity:0; transition:opacity .2s}
  .dlg-bg.show{opacity:1}
  .dlg{width:100%; max-width:420px; background:linear-gradient(180deg,#1a1030,var(--bg-2)); border:1px solid rgba(177,76,255,.4); border-radius:22px; padding:22px 20px 18px;
    transform:translateY(24px) scale(.98); transition:transform .28s cubic-bezier(.34,1.3,.55,1); box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(177,76,255,.18)}
  .dlg-bg.show .dlg{transform:none}
  .dlg .ic{width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; margin-bottom:14px;
    background:rgba(177,76,255,.16); color:var(--pur); box-shadow:0 0 14px rgba(177,76,255,.25)}
  .dlg .ic.red{background:rgba(255,43,214,.14); color:var(--mag); box-shadow:0 0 14px rgba(255,43,214,.25)}
  .dlg .ic.green{background:rgba(200,255,58,.12); color:var(--lime); box-shadow:0 0 14px rgba(200,255,58,.2)}
  .dlg h3{margin:0 0 8px; font-size:1.1rem; font-weight:800; letter-spacing:-.01em}
  .dlg p{margin:0; color:var(--ink-dim); font-size:.9rem; line-height:1.6}
  .dlg ul{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:6px}
  .dlg li{position:relative; padding-left:16px; color:var(--ink-dim); font-size:.85rem; line-height:1.5; text-align:left; word-break:keep-all}
  .dlg li b{color:var(--ink)}
  .dlg li::before{content:""; position:absolute; left:0; top:.55em; width:6px; height:6px; border-radius:50%; background:var(--pur); box-shadow:0 0 6px var(--pur)}
  .dlg .acts{display:flex; gap:10px; margin-top:20px}
  .dlg .acts button{flex:1; min-height:50px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    font:inherit; font-weight:800; font-size:.95rem; cursor:pointer; touch-action:manipulation}
  .dlg .acts button.primary{background:linear-gradient(135deg,var(--mag),var(--pur)); color:#fff; border-color:transparent; box-shadow:0 0 22px rgba(255,43,214,.45)}
  .dlg .acts button.danger{background:linear-gradient(135deg,#ff2b6b,var(--mag)); color:#fff; border-color:transparent; box-shadow:0 0 22px rgba(255,43,107,.4)}
  .dlg .acts button:focus-visible{outline:2px solid var(--pur); outline-offset:2px}
  @media (min-width:520px){ .dlg-bg{align-items:center} }
  @media (prefers-reduced-motion:reduce){ .dlg-bg,.dlg,.weekchip .sw::after{transition:none} }

  /* ── 요일 탭: 원판 컬러 ───────────── */
  nav{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:12px 16px; max-width:640px; margin:0 auto}
  nav button{
    min-height:var(--tap); border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-dim); font:inherit; font-weight:800; font-size:.8rem; padding:0 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer;
  }
  nav button .dot{width:9px; height:9px; border-radius:50%; background:var(--c,transparent); opacity:.75}
  nav button.on{background:linear-gradient(180deg,rgba(177,76,255,.25),rgba(177,76,255,.08)); color:#fff; border-color:var(--pur);
    box-shadow:0 0 18px rgba(177,76,255,.45), inset 0 0 0 1px rgba(177,76,255,.4)}
  nav button.on .dot{opacity:1; box-shadow:0 0 8px var(--c,transparent)}
  nav button:focus-visible{outline:2px solid var(--pur); outline-offset:2px}

  main{max-width:640px; margin:0 auto; padding:0 16px}

  /* ── 데이 요약 ─────────────────────── */
  .dayhead{display:flex; align-items:center; gap:10px; margin:10px 0 4px}
  .dayhead .plate{width:14px; height:14px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c)}
  .dayhead h2{margin:0; font-size:1.1rem; font-weight:800}
  .dayhead .time{margin-left:auto; color:var(--ink-faint); font-size:.8rem; font-weight:700}
  .daynote{color:var(--ink-dim); font-size:.85rem; margin:2px 0 14px; line-height:1.5}

  /* ── 워밍업 ───────────────────────── */
  details.warm{background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden}
  details.warm summary{
    list-style:none; cursor:pointer; padding:14px 16px; font-weight:800; font-size:.9rem;
    color:var(--pur); display:flex; align-items:center; gap:8px; min-height:var(--tap);
  }
  details.warm summary::-webkit-details-marker{display:none}
  details.warm summary::after{content:"▾"; margin-left:auto; transition:transform .2s}
  details.warm[open] summary::after{transform:rotate(180deg)}
  details.warm .body{padding:0 16px 14px; color:var(--ink-dim); font-size:.88rem; line-height:1.7}
  details.warm .body b{color:var(--ink)}

  /* ── 종목 카드 ─────────────────────── */
  .ex{background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden; position:relative}
  .ex::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--pur),var(--mag))}
  .ex-head{padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px}
  .ex-head .order{color:var(--cyan); font-weight:900; font-size:.95rem; min-width:1.4em; text-shadow:0 0 8px rgba(46,230,255,.6)}
  .ex-head .name{font-weight:800; font-size:1rem; line-height:1.35}
  .ex-head .meta{color:var(--ink-dim); font-size:.8rem; margin-top:3px; line-height:1.5}
  .ex-head .rest{margin-left:auto; text-align:right; color:var(--ink-faint); font-size:.75rem; font-weight:700; white-space:nowrap}
  .ex-head .rest b{display:block; color:var(--ink-dim); font-size:.9rem}
  .cue{margin:0 16px 10px; padding:9px 12px; background:rgba(177,76,255,.08); border:1px solid rgba(177,76,255,.2); border-radius:10px;
    color:var(--ink-dim); font-size:.82rem; line-height:1.55}

  /* 세트 행 */
  .sets{padding:4px 12px 14px}
  .setrow{display:grid; grid-template-columns:2.2em 1fr 1fr var(--tap); gap:8px; align-items:center;
    padding:5px 0}
  .setrow .idx{color:var(--ink-faint); font-weight:800; font-size:.85rem; text-align:center}
  .field{position:relative}
  .field input{
    width:100%; min-height:var(--tap); background:var(--well); border:1px solid var(--line);
    border-radius:10px; color:var(--ink); font:inherit; font-weight:700; font-size:1rem;
    text-align:center; padding:8px 8px 8px 8px;
  }
  .field input:focus{outline:2px solid var(--pur); outline-offset:-1px; border-color:var(--pur); box-shadow:0 0 12px rgba(177,76,255,.35)}
  .field .unit{position:absolute; right:9px; top:50%; transform:translateY(-50%);
    font-size:.68rem; color:var(--ink-faint); font-weight:700; pointer-events:none}
  .chk{
    min-width:var(--tap); min-height:var(--tap); border-radius:10px; border:1px solid var(--line);
    background:var(--well); color:var(--ink-faint); font-size:1.15rem; font-weight:900; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:box-shadow .2s, background .15s;
  }
  .chk.on{background:var(--lime); border-color:var(--lime); color:#0b1200; box-shadow:0 0 16px rgba(200,255,58,.55)}
  .chk:focus-visible{outline:2px solid var(--pur); outline-offset:2px}
  .setrow.done input{color:var(--ink-dim)}

  /* 진행 배지 */
  .prog{margin:2px 16px 14px; padding:10px 12px; border-radius:10px; font-size:.85rem; font-weight:700;
    display:none; line-height:1.5}
  .prog.hit{display:block; background:rgba(200,255,58,.10); color:var(--lime); border:1px solid rgba(200,255,58,.35)}
  .prog.keep{display:block; background:rgba(255,176,32,.08); color:var(--amber); border:1px solid rgba(255,176,32,.3)}

  /* ── 휴식 타이머 시트 ─────────────────── */
  .tsheet{
    touch-action:none;
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:linear-gradient(180deg,#1a1030,var(--bg-2)); border-radius:28px 28px 0 0;
    border-top:1px solid rgba(177,76,255,.4);
    box-shadow:0 -12px 40px rgba(0,0,0,.6), 0 -10px 50px rgba(177,76,255,.22);
    padding:10px 24px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .55s cubic-bezier(.34,1.45,.55,1);
    display:flex; flex-direction:column;
  }
  .tsheet.show{transform:translateY(0)}
  @keyframes ringPop{0%{transform:scale(.55) rotate(-25deg);opacity:0} 60%{transform:scale(1.06) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)}}
  @keyframes numPop{0%{transform:scale(.4);opacity:0} 55%{transform:scale(1.18)} 100%{transform:scale(1);opacity:1}}
  @keyframes goBounce{0%{transform:scale(.6)} 40%{transform:scale(1.35)} 65%{transform:scale(.92)} 100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}}
  .tsheet.enter .ring{animation:ringPop .6s cubic-bezier(.34,1.45,.55,1) both}
  .tsheet.enter .ring .t .n{animation:numPop .5s .18s cubic-bezier(.34,1.45,.55,1) both}
  .tsheet.enter .next,.tsheet.enter .btns{animation:numPop .4s .3s ease-out both}
  .tsheet.zero .ring .t .n{animation:goBounce .6s cubic-bezier(.34,1.45,.55,1) both}
  .tsheet.zero .ring{animation:shake .5s .1s ease-in-out}
  .tsheet.warn .ring .t .n{animation:numPop .35s ease-out}
  .tsheet .handle{width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px}
  .tsheet .grab{min-height:var(--tap); margin:-10px -24px 0; padding:10px 24px 0; cursor:pointer}
  .tsheet .tex{font-size:.85rem; color:var(--ink-dim); font-weight:700}
  .tsheet .tex b{display:block; color:var(--ink); font-size:1.1rem; margin-top:3px; font-weight:800}
  .ring{position:relative; width:min(62vw,240px); height:min(62vw,240px); margin:16px auto 4px; filter:drop-shadow(0 0 14px rgba(46,230,255,.45))}
  .tsheet.warn .ring{filter:drop-shadow(0 0 14px rgba(255,176,32,.5))}
  .tsheet.zero .ring{filter:drop-shadow(0 0 18px rgba(200,255,58,.55))}
  .ring svg{width:100%; height:100%; transform:rotate(-90deg)}
  .ring circle{fill:none; stroke-width:12}
  .ring .track{stroke:var(--line)}
  .ring .bar{stroke:url(#ringGrad); stroke-linecap:round; transition:stroke .3s}
  .ring .t{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .t .n{font-size:clamp(48px,16vw,64px); font-weight:900; line-height:1; letter-spacing:.01em; text-align:center; width:100%; padding:0 14%; box-sizing:border-box;
    color:#fff; text-shadow:0 0 18px rgba(46,230,255,.8)}
  .ring .t .s{font-size:.75rem; color:var(--ink-dim); margin-top:8px; font-weight:700}
  .tsheet.warn .ring .bar{stroke:var(--amber)} .tsheet.warn .ring .n{color:var(--amber); text-shadow:0 0 18px rgba(255,176,32,.7)}
  .tsheet.zero .ring .bar{stroke:var(--lime)} .tsheet.zero .ring .n{color:var(--lime); text-shadow:0 0 22px rgba(200,255,58,.8)}
  .tsheet .next{text-align:center; font-size:.85rem; color:var(--ink-dim); margin-top:6px; min-height:1.3em}

<body>

<div class="topbar" id="topbar">
<header>
  <div class="brand">
    <div class="lockup">
      <h1><span class="logo">쇠질<u>로그</u></span></h1>
      <span class="tag">The Iron never <b>lies.</b></span>
    </div>
    <div class="hbtns">

    </div>
  </div>
  <div class="datebar">
    <input type="date" id="dateInput" aria-label="운동 날짜">
    <button class="weekchip" id="weekChip" type="button" aria-pressed="false" aria-label="디로드 모드 전환"><span class="wk num" id="weekTxt"></span><span class="sw" aria-hidden="true"></span></button>
  </div>
</header>

<nav id="tabs" aria-label="요일 선택"></nav>
</div>
<main id="view"></main>

<div class="golf" id="golf" role="dialog" aria-label="샷 페이서" hidden>
  <div class="golf-top">
    <div class="golf-title">샷 페이서</div>
    <button class="golf-x" id="golfClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="golf-cfg" id="golfCfg">
    <div class="cfgrow"><label>시간당 샷 수</label><div class="stepper"><button data-k="per" data-d="-10">−</button><b class="num" id="gPer">100</b><button data-k="per" data-d="10">+</button></div></div>
    <div class="cfgrow"><label>샷 간격</label><b class="num golf-interval" id="gInt">36초</b></div>
    <div class="cfgrow"><label>총 샷 수 (0 = 무제한)</label><div class="stepper"><button data-k="total" data-d="-10">−</button><b class="num" id="gTotal">100</b><button data-k="total" data-d="10">+</button></div></div>
  </div>
  <div class="golf-main">
    <div class="golf-count num"><span id="gShot">0</span><small id="gOf"> / 100</small></div>
    <div class="golf-big num" id="gBig">—</div>
    <div class="golf-sub" id="gSub">시작을 누르면 첫 샷까지 카운트다운</div>
    <div class="golf-elapsed num" id="gElapsed"></div>
  </div>
  <div class="golf-btns">
    <button id="gStart" class="primary" type="button">시작</button>
    <button id="gPause" type="button" hidden>일시정지</button>
    <button id="gReset" type="button" hidden>리셋</button>
  </div>
</div>
<div class="tsheet" id="tsheet" role="dialog" aria-label="휴식 타이머">
  <div class="grab" id="tGrab">
    <div class="handle"></div>
    <div class="stripe"></div>
    <div class="tex" id="tEx">휴식<b id="tExName">—</b></div>
    <div class="mini-n num" id="tMiniN">—</div>
  </div>
  <div class="ring">
    <svg viewBox="0 0 250 250" aria-hidden="true">
      <circle class="track" cx="125" cy="125" r="112"/>
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6ff"/><stop offset="1" stop-color="#b14cff"/></linearGradient></defs>
      <circle class="bar" id="tBar" cx="125" cy="125" r="112" stroke-dasharray="703.7" stroke-dashoffset="0"/>
    </svg>
    <div class="t"><div class="n num" id="tN">—</div><div class="s num" id="tS"></div></div>
  </div>
  <div class="next" id="tNext"></div>
  <div class="btns">
    <button id="tPlus" type="button">+30초</button>
    <button id="tSkip" type="button" class="primary">건너뛰기</button>
  </div>
</div>

function loadSession(dayKey){

function setDeload(on){
  DELOAD.on = !!on; store.set('deload:on', on?'1':'0');
  // 오늘 날짜의 아직 손대지 않은 세션 캐시는 버려서 새 중량으로 다시 만든다 (체크된 세트가 있으면 보존)
  PROGRAM.forEach(d=>{
    const raw=store.get(skey(curDate,d.key)); if(!raw) return;
    try{ const data=JSON.parse(raw); const touched=data.ex.some(x=>x.sets.some(st=>st.done)); if(!touched) store.del(skey(curDate,d.key)); }catch(e){}
  });
  renderWeek(); renderView();
}
/* 자동 워밍업(디로드·팔꿈치 모드): 일반 동작 부분은 그대로, 메인 리프트 램프는 오늘 표시 중량에서 계산 */
function autoWarm(day, data){
  const base = day.warm.split('<br><b>')[0];
  const fmt = v => String(v).replace(/\.0$/,'');
  const r25 = v => Math.round(v/2.5)*2.5;
  const lines = (day.warmMain||[]).map(m=>{
    const xi = day.ex.findIndex(e=>e.n===m.ex);
    const W = xi>=0 ? (data.ex[xi]?.w||0) : 0;
    let ramp;
    const belt = DELOAD.on ? ' (벨트 없이)' : '';
    if(!(W>0)) ramp = '가볍게 1~2세트 → 본세트';
    else if(m.kind==='bar')   ramp = W>=100 ? `빈봉×10 → ${fmt(r25(W*0.5))}×5 → ${fmt(r25(W*0.72))}×3 → ${fmt(r25(W*0.88))}×1 → 본세트 ${fmt(W)}`
                                 : W>=50 ? `빈봉×10 → ${fmt(r25(W*0.75))}×5 → 본세트 ${fmt(W)}` : `빈봉×10 → 본세트 ${fmt(W)}`;
    else if(m.kind==='dead')  ramp = W>100 ? `60×5 → ${fmt(r25(W*0.8))}×2 → 본세트 ${fmt(W)}${belt}` : W>60 ? `60×5 → 본세트 ${fmt(W)}${belt}` : `본세트 ${fmt(W)} 바로${belt}`;
    else if(m.kind==='stack') ramp = `스택 최하단×10 → 본세트 ${fmt(W)}`;
    else                      ramp = W>=30 ? `${fmt(r25(W/2))}×8 → 본세트 ${fmt(W)}` : `가볍게 1세트 → 본세트 ${fmt(W)}`;
    return `<b>${m.label}:</b> ${ramp}`;
  });
  return [base, ...lines].join('<br>');
}
function saveSession(dayKey, data){
  if(DELOAD.on) data.deload=true;
  if(ELBOW.on) data.elbow=true;
  store.set(skey(curDate, dayKey), JSON.stringify(data));
}

/* ══════════ 메인 뷰 ══════════ */
const view = document.getElementById('view');
function renderView(){
  if(curTab==='hist'){ renderHistory(); return }
  const day = PROGRAM.find(d=>d.key===curTab);
  const data = loadSession(day.key);
  view.innerHTML = '';
  view.style.setProperty('--c', day.color);

  const head = document.createElement('div');
  head.innerHTML = `
    <div class="dayhead" style="--c:${day.color}">
      <span class="plate"></span><h2>${day.name}</h2><span class="time">${DELOAD.on ? (day.timeD||day.time) : day.time}</span>
    </div>
    <p class="daynote">${DELOAD.on ? (day.noteD||day.note) : day.note}</p>
    <details class="warm"><summary>워밍업${DELOAD.on?' (디로드 중량 기준)':ELBOW.on?' (오늘 중량 기준)':''}</summary><div class="body">${(DELOAD.on||ELBOW.on) ? autoWarm(day, data) : day.warm}</div></details>`;
  view.appendChild(head);
  if(ELBOW.on){
    const b=document.createElement('div'); b.className='deload-banner elbow';
    b.innerHTML='<b>🩹 팔꿈치 모드</b> — 외측상과염 보호. 손목으로 버티는 종목은 제외·대체, 당기기는 스트랩 <b>80%</b>, 컬은 <b>70%</b>. 증량 판정 쉼, 이월 중량 보존. 기준: 운동 중 통증 3/10 이내 · 다음 날 아침 더 아프면 중단 · 프롤로 후 3~4일은 그립 부하 없음.';
    view.insertBefore(b, head.nextSibling);
  }
  if(DELOAD.on){
    const b=document.createElement('div'); b.className='deload-banner';
    b.innerHTML='<b>디로드 주간</b> — 중량 60%(2.5kg 단위) · 세트 절반 · 워밍업과 큐도 디로드 기준으로 표시. 증량 판정 없음, 이월 중량은 그대로. 주말에 상단 스위치로 끄세요.';
    view.insertBefore(b, head.nextSibling);
  }

  day.ex.forEach((ex0, xi)=>{
    const st = data.ex[xi];
    const card = document.createElement('section');
    card.className = 'ex';
    card.style.setProperty('--c', day.color);
    if(st.skipped || elbowSkip(ex0)){
      card.classList.add('skipped');
      card.innerHTML = `<div class="ex-head"><span class="order num">${xi+1}</span><div><div class="name">${ex0.n}</div><div class="meta">🩹 팔꿈치 모드 — 이번 세션 제외</div></div></div><div class="cue">${ex0.elbow.skip}</div>`;
      view.appendChild(card); return;
    }
    const ex = effEx(ex0);

    const restTxt = ex.rest>=60 ? `${Math.floor(ex.rest/60)}분${ex.rest%60?` ${ex.rest%60}초`:''}` : `${ex.rest}초`;
    card.innerHTML = `
      <div class="ex-head">
        <span class="order num">${xi+1}</span>
        <div>
          <div class="name">${ex.n}</div>
          <div class="meta num">${DELOAD.on ? `${st.sets.length}세트 × ${ex.r}회 · 디로드 (원래 ${ex.s}세트)` : `${ex.s}세트 × ${ex.r}회 목표`}${(!DELOAD.on && st.epct) ? ` · 🩹 ${Math.round(st.epct*100)}%` : ''}</div>
        </div>
        <div class="rest">휴식<b class="num">${restTxt}</b></div>
      </div>
      ${(()=>{ const c = elbowCue(ex, DELOAD.on ? (ex.cueD||ex.cue) : ex.cue); return c ? `<div class="cue">${c}</div>` : '' })()}
      <div class="sets"></div>
      <div class="prog num"></div>`;

    const setsEl = card.querySelector('.sets');
    st.sets.forEach((set, si)=>{
      const row = document.createElement('div');
      row.className = 'setrow' + (set.done?' done':'');
      row.innerHTML = `
        <span class="idx num">${si+1}</span>
        <div class="field" ${ex.noW?'style="visibility:hidden"':''}><input type="number" inputmode="decimal" step="0.5" min="0"
          aria-label="${ex.n} ${si+1}세트 ${ex.unit||'중량'}" value="${ex.noW?'':(ex.perSet ? (set.w ?? ex.perSet[si] ?? st.w) : st.w)}" data-role="w" ${ex.noW?'disabled':''}><span class="unit">${ex.unit||'kg'}</span></div>
        <div class="field"><input type="number" inputmode="numeric" step="1" min="0"
          aria-label="${ex.n} ${si+1}세트 횟수" placeholder="${ex.lastMin && !DELOAD.on && si===st.sets.length-1 ? ex.r+'~'+ex.lastMin : ex.r}" value="${set.r??''}" data-role="r"><span class="unit">회</span></div>
        <button class="chk ${set.done?'on':''}" aria-label="${si+1}세트 완료">${set.done?'✓':'○'}</button>`;

      const wIn = row.querySelector('[data-role=w]');
      const rIn = row.querySelector('[data-role=r]');
      const chk = row.querySelector('.chk');

      wIn.addEventListener('change', ()=>{
        const v = parseFloat(wIn.value)||0;
        if(ex.perSet){ set.w = v; saveSession(day.key, data); return; }   // 세트별 개별값 (속도 등)
        st.w = v;
        // 같은 종목 모든 세트 중량 동기화
        card.querySelectorAll('[data-role=w]').forEach(i=>i.value=v||'');
        saveSession(day.key, data); updateProg();
      });
      rIn.addEventListener('change', ()=>{
        set.r = rIn.value==='' ? null : parseInt(rIn.value,10);
        saveSession(day.key, data); updateProg();
      });
      chk.addEventListener('click', ()=>{
        set.done = !set.done;
        if(set.done){
          if(set.r==null){ set.r = ex.r; rIn.value = ex.r } // 빈칸이면 목표횟수로 기록
          chk.classList.add('on'); chk.textContent='✓'; row.classList.add('done');
          const isLastSet = st.sets.every(s=>s.done);
          if(!isLastSet){
            const nx = st.sets.findIndex(x=>!x.done);
            const wTxt = ex.perSet ? `${st.sets[nx].w ?? ex.perSet[nx]}${ex.unit||'kg'} × ` : (st.w>0 ? `${st.w}kg × ` : (ex.bw ? '맨몸 × ' : ''));
            const target = (ex.lastMin && !DELOAD.on && nx===st.sets.length-1) ? `${ex.r}~${ex.lastMin}회` : `${ex.r}회`;
            startTimer(ex.rest, {ex:ex.n, done:si+1, next:`${nx+1}세트 · ${wTxt}${target}`, goText:`${wTxt}${target}`});
          } else {
            // 종목 완료 → 다음 종목까지 전환 휴식 (양쪽 종목의 휴식 처방 평균, 90초~3분)
            let ni = xi+1; while(ni<day.ex.length && (data.ex[ni].skipped || !data.ex[ni].sets.length)) ni++;
            const nextEx = day.ex[ni] ? effEx(day.ex[ni]) : null;
            if(nextEx){
              const nst = data.ex[ni];
              let trans = Math.round((ex.rest + nextEx.rest)/2/15)*15;
              trans = Math.max(90, Math.min(180, trans));
              const nw = nst && nst.w>0 ? `${nst.w}kg × ` : (nextEx.bw ? '맨몸 × ' : '');
              const nsets = nst ? nst.sets.length : nextEx.s;
              startTimer(trans, {ex:ex.n, done:si+1, next:`${nextEx.n} · ${nw}${nextEx.r}회${nsets>1?` ×${nsets}세트`:''}`, goText:`${nw}${nextEx.r}회`});
              tExName.textContent = `${ex.n} 완료 — 종목 전환`;
            } else stopTimer(`${ex.n} 완료 — 오늘 세션 끝`);
          }
        } else {
          chk.classList.remove('on'); chk.textContent='○'; row.classList.remove('done');
        }
        saveSession(day.key, data); updateProg();
      });
      setsEl.appendChild(row);
    });

    const progEl = card.querySelector('.prog');
    function updateProg(){
      const allDone = st.sets.length && st.sets.every(s=>s.done);
      const lastOk  = !ex.lastMin || ((st.sets[st.sets.length-1].r??0) >= ex.lastMin);
      const allHit  = allDone && st.sets.every(s=> (s.r??0) >= ex.r ) && lastOk;
      progEl.className = 'prog num';
      if(!allDone){ progEl.style.display='none'; return }
      if(st.deload || data.deload){
        progEl.classList.add('keep'); progEl.textContent = '디로드 세션 완료 — 증량 판정 없음, 이월 중량 유지'; return;
      }
      if(st.elbow){
        progEl.classList.add('keep'); progEl.textContent = '🩹 팔꿈치 모드 — 증량 판정 없음, 이월 중량 유지'; return;
      }
      // 중량 미입력 보조운동: 이월·증량 판정 없이 안내만
      if(ex.prog>0 && !ex.bw && !(st.w>0)){
        progEl.classList.add('keep');
        progEl.textContent = allHit ? '마지막 세트 상한 달성 — 중량을 적어두면 다음 주부터 자동 증량' : '중량을 적어두면 다음 주부터 자동 판정';
        return;
      }
      // 다음 세션 시작 중량 저장: 달성 시 +prog, 미달·유지 모드면 현재 중량 유지
      const nextW = (allHit && ex.prog>0) ? st.w + ex.prog : st.w;
      if(!ex.noW && !ex.noProg) store.set(curKey(ex), String(nextW));
      if(ex.prog===0){
        progEl.classList.add('keep');
        progEl.textContent = ex.noProg ? '완료 — 4본 수행' : '완료 — 횟수 종목, 폼 유지';
      } else if(allHit){
        progEl.classList.add('hit');
        progEl.textContent = `전 세트 목표 달성 — 다음 주 +${ex.prog}kg (${(st.w+ex.prog).toFixed(1).replace(/\.0$/,'')}kg)`;
      } else {
        progEl.classList.add('keep');
        progEl.textContent = ex.lastMin
          ? `마지막 세트 ${ex.lastMin}회 미달 — 다음 주 같은 중량 유지`
          : '횟수 미달 세트 있음 — 다음 주 같은 중량으로 재도전';
      }
    }
    updateProg();
    view.appendChild(card);
  });

  const rules = document.createElement('div');
  rules.className='rules';
  rules.innerHTML = `<h3>운영 규칙</h3>
    <b>메인 리프트</b>(벤치·인클라인): 전 세트 목표 횟수 달성 → 다음 주 +2.5kg<br>
    <b>보조 종목</b>: 마지막 세트를 표시된 상한까지 (상한 되면 멈춤). 상한 달성 시 자동 증량, 미달 시 유지<br>
    <b>하체(금)</b>: 유지 모드 — 스쿼트 125 / 데드 145 고정(RIR 3). 풋살까지 5일<br>

    <b>팔꿈치 모드</b>(상단 🩹): 레터럴 → 손목 커프 · 푸시다운/스트레이트암/페이스풀/OH익스텐션 제외 · 당기기 스트랩 80% · 컬 70% · 증량 판정 쉼 · 통증 3/10 이내. 통과 주마다 90% → 100%는 수동<br>
    <b>디로드</b>: 5주 훈련 + 1주 — 중량 60%(2.5kg 단위) · 세트 절반 · 풀업 맨몸 · 외회전 유지 · 가속 달리기 2본 · 드랍세트 없음 · 증량 판정 없음. 상단 스위치로 켜고 끔<br>
    영양: 평일 3,200kcal · 수 3,800kcal · 단백질 160g · 수면 7시간+`;
  view.appendChild(rules);
}

/* ══════════ 기록 화면 ══════════ */
function renderHistory(){
  view.innerHTML = '<div class="dayhead"><h2>세션 기록</h2></div>';
  const keys = store.keys().filter(k=>k.startsWith('log:')).sort().reverse();
  let shown = 0;
  keys.forEach(k=>{
    const [,date,dayKey] = k.split(':');
    const cday = CARDIO.find(d=>d.key===dayKey);
    if(cday){
      let cd; try{ cd = JSON.parse(store.get(k)) }catch(e){ return }
      if(!cd || !cd.done) return;
      shown++;
      const card = document.createElement('div');
      card.className='histcard'; card.style.setProperty('--c', cday.color);
      card.innerHTML = `<div class="top"><span class="dot"></span>${cday.name}<span class="d num">${date}</span></div>
        <div class="hstats num">${cd.summary||''} <span class="vd ok">완료</span></div>
        <button class="del">이 기록 삭제</button>`;
      card.querySelector('.del').onclick = async ()=>{ if(await askDialog({icon:'✕',tone:'red',title:'기록 삭제',body:`${date} ${cday.name} 기록을 삭제합니다. 되돌릴 수 없습니다.`,ok:'삭제',okTone:'danger'})){ store.del(k); renderHistory() } };
      view.appendChild(card); return;
    }
    const day = PROGRAM.find(d=>d.key===dayKey); if(!day) return;
    let data; try{ data = JSON.parse(store.get(k)) }catch(e){ return }
    let done=0, total=0, vol=0, hitCnt=0, judged=0;
    const rows = [];
    data.ex.forEach((st,xi)=>{
      const ex = day.ex[xi]; if(!ex) return;
      let exDone=0;
      st.sets.forEach(s=>{ if(s.done){ exDone++ } });
      if(exDone===0){ if(!ex.opt) total += st.sets.length; return }
      st.sets.forEach(s=>{ total++; if(s.done){ done++; vol += (st.w||0)*(s.r||0) } });
      const allDone = st.sets.every(s=>s.done);
      const lastOk  = !ex.lastMin || ((st.sets[st.sets.length-1].r??0) >= ex.lastMin);
      const allHit  = allDone && st.sets.every(s=> (s.r??0) >= ex.r ) && lastOk;
      const reps = st.sets.map(s=> s.done ? (s.r??0) : '–').join('/');
      const wTxt = ex.noW ? '' : ex.perSet ? st.sets.map(x=> x.w ?? '').filter(x=>x!=='').join('·')+(ex.unit||'kg') : (st.w>0 ? `${st.w}kg` : '맨몸');
      let badge;
      if(!allDone){
        badge = `<span class="fb gray">미완료</span>`;
      } else if(st.elbow){
        badge = `<span class="fb gray">🩹 ${st.epct?Math.round(st.epct*100)+'%':'유지'}</span>`;
      } else if(ex.prog>0 && !ex.bw && !ex.noW && !(st.w>0)){
        judged++; hitCnt += allHit?1:0;
        badge = `<span class="fb gray">중량 미기록</span>`;
      } else if(ex.prog===0){
        judged++; hitCnt += allHit?1:0;
        badge = `<span class="fb gray">횟수 종목</span>`;
      } else if(allHit){
        judged++; hitCnt++;
        badge = `<span class="fb up">↑ 다음 ${(st.w+ex.prog).toFixed(1).replace(/\.0$/,'')}kg</span>`;
      } else {
        judged++;
        badge = `<span class="fb keep">${wTxt} 유지</span>`;
      }
      rows.push(`<div class="hrow"><span class="hname">${st.n||ex.n}</span><span class="hres num">${wTxt?wTxt+' · ':''}${reps}</span>${badge}</div>`);
    });
    if(done===0) return;
    shown++;
    const allSession = done===total && judged>0 && rows.every(r=>!r.includes('fb keep')&&!r.includes('미완료'));
    const verdict = data.deload ? `<span class="vd warn">디로드</span>` : done<total
      ? `<span class="vd gray">중단됨</span>`
      : allSession ? `<span class="vd ok">전 종목 달성</span>` : `<span class="vd warn">일부 미달</span>`;
    const card = document.createElement('div');
    card.className='histcard'; card.style.setProperty('--c', day.color);
    card.innerHTML = `
      <div class="top"><span class="dot"></span>${day.name}<span class="d num">${date}</span></div>
      <div class="hstats num">완료 ${done}/${total} 세트 · 볼륨 ${vol.toLocaleString()}kg ${verdict}${data.elbow?' <span class="vd gray">🩹 팔꿈치</span>':''}</div>
      <div class="hrows">${rows.join('')}</div>
      <button class="del">이 기록 삭제</button>`;
    card.querySelector('.del').onclick = async ()=>{
      if(await askDialog({icon:'✕',tone:'red',title:'기록 삭제',body:`${date} ${day.name} 기록을 삭제합니다. 되돌릴 수 없습니다.`,ok:'삭제',okTone:'danger'})){ store.del(k); renderHistory() }
    };
    view.appendChild(card);
  });
  if(!shown){
    view.innerHTML += `<div class="empty">아직 기록이 없습니다.<br>요일 탭에서 세트를 체크하면 자동 저장됩니다.</div>`;
  }
  const tools = document.createElement('div');
  tools.className='toolrow';
  tools.innerHTML = `<button id="expBtn">백업 내보내기 (기록 + 이월 중량)</button><button id="impBtn">기록 불러오기</button>`;
  view.appendChild(tools);
  document.getElementById('expBtn').onclick = ()=>{
    const dump = {};
    store.keys().filter(k=>k.startsWith('log:')||k.startsWith('cur:')||k.startsWith('migrated:')||k.startsWith('deload:')||k.startsWith('elbow:')).forEach(k=>dump[k]=store.get(k));
    const blob = new Blob([JSON.stringify(dump,null,1)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `쇠질로그_백업_${todayISO()}.json`; a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('impBtn').onclick = ()=>{
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{ try{
        const dump = JSON.parse(rd.result);
        Object.entries(dump).forEach(([k,v])=>{ if(k.startsWith('log:')||k.startsWith('cur:')||k.startsWith('migrated:')) store.set(k,v) });
        alert('기록과 이월 중량을 불러왔습니다');
        renderHistory();
      }catch(e){ alert('파일 형식을 읽을 수 없습니다') } };
      rd.readAsText(f);
    };
    inp.click();
  };
}

/* ══════════ 토요일: 반복 스프린트 (오디오 가이드) ══════════ */
const SPR_KEY='cfg:sprint';
function sprintCfg(){
  const d={reps:8, perSet:4, recover:30, setRest:120, lead:30, window:8};
  try{ return Object.assign(d, JSON.parse(store.get(SPR_KEY)||'{}')) }catch(e){ return d }
}
/* 일정표: [{t, kind}] kind = go | rest | end, 카운트다운은 재생 시 자동 */
function sprintSchedule(c){
  const ev=[]; let t=c.lead;
  for(let i=1;i<=c.reps;i++){
    ev.push({t, kind:'go', rep:i});
    if(i===c.reps){ t+=c.window+5; ev.push({t, kind:'end'}); break }
    t += c.window + ((i % c.perSet===0) ? c.setRest : c.recover);
    if(i % c.perSet===0) ev.push({t: t-c.setRest+c.window*0, kind:'rest'}); // 세트 휴식 시작 알림
  }
  return ev.sort((a,b)=>a.t-b.t);
}
/* WAV 렌더링: 8kHz 8bit mono, 전 구간 신호음 굽기 → <audio>로 재생하면 화면 꺼져도 이어짐 */
function buildSprintWav(c){
  const sr=8000, ev=sprintSchedule(c), total=Math.ceil(ev[ev.length-1].t+3);
  const n=sr*total, pcm=new Float32Array(n);
  const tone=(t0,dur,f,amp=0.9)=>{ const s0=Math.floor(t0*sr), s1=Math.min(n,Math.floor((t0+dur)*sr));
    for(let i=s0;i<s1;i++){ const x=(i-s0)/sr; const env=Math.min(1,x*40,(s1-i)/sr*40); pcm[i]+=amp*env*Math.sin(2*Math.PI*f*x) } };
  const countdown=t=>{ tone(t-3,0.12,880); tone(t-2,0.12,880); tone(t-1,0.12,880) };
  ev.forEach(e=>{
    if(e.kind==='go'){ countdown(e.t); tone(e.t,0.9,1320) }                       // 출발: 긴 고음
    else if(e.kind==='rest'){ tone(e.t,0.35,440); tone(e.t+0.45,0.35,440) }        // 세트 휴식: 저음 2회
    else if(e.kind==='end'){ tone(e.t,0.3,880); tone(e.t+0.4,0.3,1100); tone(e.t+0.8,0.7,1320) } // 종료: 상승 3음
  });
  // 시작 안내: 재생 즉시 짧은 음 1회 (이어폰 연결 확인용)
  tone(0.2,0.15,880);
  const buf=new ArrayBuffer(44+n), v=new DataView(buf);
  const ws=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  ws(0,'RIFF'); v.setUint32(4,36+n,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  ws(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i, Math.max(0,Math.min(255, Math.round(128+pcm[i]*120))));
  return {blob:new Blob([buf],{type:'audio/wav'}), ev, total};
}
let sprAudio=null, sprEv=[], sprTotal=0, sprRaf=null;
function fmtS(s){ s=Math.max(0,Math.round(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` }
function renderSprint(){
  const c=sprintCfg();
  view.innerHTML='';
  const rawLog=store.get(skey(curDate,'sat')); let log=null; try{ log=rawLog?JSON.parse(rawLog):null }catch(e){}
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <div class="dayhead" style="--c:#ff7a45"><span class="plate"></span><h2>반복 스프린트 인터벌</h2><span class="time num">약 ${Math.round((sprintSchedule(c).slice(-1)[0].t)/60)+10}분</span></div>
    <p class="daynote">30m 스프린트 90% → 걸어서 복귀. 이어폰만 끼고 폰은 내려두세요. <b>긴 고음 = 출발</b>, 짧은 삑 3번 = 3초 전, 저음 2번 = 세트 휴식 시작, 상승 3음 = 종료.</p>
    <details class="warm"><summary>워밍업 · 마무리</summary><div class="body">조깅 5분 → 레그스윙, 워킹 런지, 하이니, 버트킥 → 가속 60·75% 2본<br><b>끝나고</b> 걷기 5분. 햄스트링 당김 신호 있으면 즉시 중단</div></details>
    <section class="ex" style="--c:#ff7a45">
      <div class="ex-head"><span class="order num">1</span><div><div class="name">세션 설정</div><div class="meta">주차별 진행: 1~2주 8본 / 3~4주 10본·복귀 25초 / 디로드 6본 / 이후 12본</div></div></div>
      <div class="sets">
        <div class="cfgrow"><label>스프린트 본 수</label><div class="stepper"><button data-k="reps" data-d="-1">−</button><b class="num" id="v-reps">${c.reps}</b><button data-k="reps" data-d="1">+</button></div></div>

        <div class="cfgrow"><label>시작 전 대기 (초)</label><div class="stepper"><button data-k="lead" data-d="-10">−</button><b class="num" id="v-lead">${c.lead}</b><button data-k="lead" data-d="10">+</button></div></div>
      </div>
    </section>
    <section class="ex" style="--c:#ff7a45">
      <div class="sprbox">
        <div class="sprphase" id="sprPhase">준비되면 시작을 누르세요</div>
        <div class="sprbig num" id="sprBig">—</div>
        <div class="sprsub num" id="sprSub"></div>
        <div class="sprbar"><div id="sprFill"></div></div>
        <div class="btns"><button id="sprStart" class="primary" type="button">오디오 가이드 시작</button><button id="sprStop" type="button" hidden>중단</button></div>
        <div class="sprhint">시작 버튼을 누른 뒤 폰을 주머니에 넣거나 내려두세요. 화면이 꺼져도 신호음은 이어폰으로 계속 나옵니다.</div>
      </div>
    </section>
    <div class="prog num ${log&&log.done?'hit':''}" style="${log&&log.done?'display:block':''}">${log&&log.done?`오늘 완료 — ${log.summary}`:''}</div>`;
  view.appendChild(wrap);

  wrap.querySelectorAll('.stepper button').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k, d=parseInt(b.dataset.d,10), cfg=sprintCfg();
      const min={reps:4,recover:15,perSet:2,setRest:60,lead:10}[k], max={reps:16,recover:90,perSet:8,setRest:240,lead:120}[k];
      cfg[k]=Math.max(min,Math.min(max,cfg[k]+d)); store.set(SPR_KEY, JSON.stringify(cfg));
      renderSprint();
    };
  });

  const phase=wrap.querySelector('#sprPhase'), big=wrap.querySelector('#sprBig'), sub=wrap.querySelector('#sprSub'), fill=wrap.querySelector('#sprFill');
  const bStart=wrap.querySelector('#sprStart'), bStop=wrap.querySelector('#sprStop');

  function syncUI(){
    if(!sprAudio) return;
    const t=sprAudio.currentTime;
    // 현재 구간 판정
    let next=sprEv.find(e=>e.t>t && e.kind==='go'); let last=[...sprEv].reverse().find(e=>e.t<=t);
    const done=sprEv.filter(e=>e.kind==='go'&&e.t<=t).length;
    if(!last){ phase.textContent=`출발선으로 — 첫 스프린트까지`; big.textContent=fmtS(sprEv[0].t-t); sub.textContent=`총 ${c.reps}본`; }
    else if(last.kind==='end' || t>=sprTotal-0.5){ phase.textContent='세션 완료'; big.textContent='끝'; sub.textContent=`${c.reps}본 완료 — 걷기 5분`; }
    else if(t < last.t + c.window && last.kind==='go'){ phase.textContent=`스프린트 ${last.rep}/${c.reps}`; big.textContent='GO'; sub.textContent='90%'; }
    else if(next){ const inSetRest = sprEv.some(e=>e.kind==='rest'&&e.t<=t&&e.t>last.t-1) || (last.kind==='rest');
      phase.textContent= inSetRest ? `세트 휴식 — ${done}/${c.reps}본 완료` : `걸어서 복귀 — ${done}/${c.reps}본 완료`;
      big.textContent=fmtS(next.t-t); sub.textContent=`다음 ${next.rep}본 출발까지`; }
    fill.style.width=`${Math.min(100,t/sprTotal*100)}%`;
    sprRaf=requestAnimationFrame(syncUI);
  }
  function finish(saveLog){
    if(sprRaf){ cancelAnimationFrame(sprRaf); sprRaf=null }
    if(sprAudio){ sprAudio.pause(); sprAudio=null }
    bStart.hidden=false; bStop.hidden=true;
    if(saveLog){
      const summary=`${c.reps}본 · 복귀 ${c.recover}초 · 세트당 ${c.perSet}본`;
      store.set(skey(curDate,'sat'), JSON.stringify({done:true, summary, cfg:c}));
      renderSprint();
    }
  }
  bStart.onclick=()=>{
    const {blob,ev,total}=buildSprintWav(c);
    sprEv=ev; sprTotal=total;
    if(sprAudio){ sprAudio.pause() }
    sprAudio=new Audio(URL.createObjectURL(blob)); sprAudio.setAttribute('playsinline','');
    sprAudio.onended=()=>finish(true);
    sprAudio.play().then(()=>{ bStart.hidden=true; bStop.hidden=false; syncUI() }).catch(()=>{ phase.textContent='재생 실패 — 다시 눌러주세요' });
  };
  bStop.onclick=async()=>{ if(await askDialog({icon:'■',tone:'red',title:'세션 중단',body:'지금 중단하면 이 세션은 기록되지 않습니다.',ok:'중단',okTone:'danger'})) finish(false) };
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && sprAudio && !sprRaf) syncUI() });
}

/* ══════════ 휴식 타이머 (시트) ══════════ */
const tsheet=document.getElementById('tsheet'), tGrab=document.getElementById('tGrab');
const tExName=document.getElementById('tExName'), tN=document.getElementById('tN'), tS=document.getElementById('tS');
const tMiniN=document.getElementById('tMiniN'), tNext=document.getElementById('tNext'), tBar=document.getElementById('tBar');
const tPlus=document.getElementById('tPlus'), tSkip=document.getElementById('tSkip');
const CIRC=703.7;
let tInt=null, tEndAt=0, tTotal=0, tDone=false, tLeft=0, tGoText='';
let audioCtx=null;
function beep(freq=880, dur=0.12, when=0){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime + when;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` }
let tRaf=null, tStartAt=0;
const easeOut = x => 1 - Math.pow(1-x, 3);
function drawRing(){
  if(!tEndAt){ tRaf=null; return }
  const now=Date.now();
  let ratio = Math.max(0, Math.min(1, (tEndAt-now)/1000/tTotal));
  const intro = Math.min(1, (now - tStartAt)/850);      // 처음 0.85초: 0에서 차오르는 연출
  if(intro<1) ratio = ratio * easeOut(intro);
  tBar.style.strokeDashoffset = String(CIRC*(1-ratio));
  tRaf = requestAnimationFrame(drawRing);
}
function tick(){
  tLeft = Math.ceil((tEndAt - Date.now())/1000);
  const shown = fmt(Math.max(tLeft,0));
  tN.textContent = shown; tMiniN.textContent = shown;
  tsheet.classList.toggle('warn', tLeft<=10 && tLeft>0);
  if(tLeft===10 && !tsheet.dataset.warned){ tsheet.dataset.warned='1'; beep(660,0.1) }
  if(tLeft<=0 && !tDone){
    tDone = true; clearInterval(tInt);
    beep(880,0.15,0); beep(880,0.15,0.25); beep(1100,0.3,0.5);
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    tsheet.classList.remove('warn'); tsheet.classList.add('zero'); tBar.style.strokeDashoffset=String(CIRC);
    tS.textContent='휴식 끝 — 다음 세트'; tN.innerHTML=`GO<small class="gonext">${tGoText}</small>`; tMiniN.textContent='GO';
    tSkip.textContent='닫기';
  }
}
function startTimer(sec, info){
  clearInterval(tInt);
  tEndAt = Date.now() + sec*1000; tTotal = sec; tDone=false; delete tsheet.dataset.warned;
  tExName.textContent = `${info.ex} · ${info.done}세트 완료`;
  tS.textContent = `${fmt(sec)} 중`;
  tNext.innerHTML = info.next ? `다음 <b>${info.next}</b>` : '';
  tGoText = info.goText || '';
  tSkip.textContent='건너뛰기';
  tsheet.classList.remove('warn','zero','mini','enter');
  void tsheet.offsetWidth;                         // 애니메이션 재트리거
  tsheet.classList.add('show','enter'); pinSheet();
  tStartAt = Date.now(); tBar.style.strokeDashoffset=String(CIRC);
  if(tRaf) cancelAnimationFrame(tRaf); tRaf = requestAnimationFrame(drawRing);
  tick(); beep(660,0.08);
  setTimeout(()=>tsheet.classList.remove('enter'), 900);
  tInt = setInterval(tick, 250);
}
function stopTimer(msg){
  clearInterval(tInt); tEndAt=0; tDone=true;
  if(tRaf){ cancelAnimationFrame(tRaf); tRaf=null }
  tExName.textContent = msg; tS.textContent=''; tNext.innerHTML='';
  tN.textContent='✓'; tMiniN.textContent='✓';
  tBar.style.strokeDashoffset='0';
  tsheet.classList.remove('warn','mini'); tsheet.classList.add('show','zero');
  setTimeout(hideTimer, 2500);
}
function hideTimer(){
  clearInterval(tInt); tEndAt=0; tDone=false; tN.textContent='—'; tSkip.textContent='건너뛰기';
  if(tRaf){ cancelAnimationFrame(tRaf); tRaf=null }
  tsheet.classList.remove('show','warn','zero','mini');
}
tSkip.onclick = hideTimer;
tPlus.onclick = ()=>{ if(!tEndAt||tDone) return; tEndAt += 30000; tTotal += 30; tS.textContent=`${fmt(tTotal)} 중`; delete tsheet.dataset.warned; tick() };
tGrab.onclick = ()=>{ if(tsheet.classList.contains('show') && !swiped){ tsheet.classList.toggle('mini'); pinSheet(); } };

/* 스와이프: 아래로 끌면 접히고, 접힌 상태에서 위로 끌면 펼쳐짐 */
let sy=0, dy=0, dragging=false, swiped=false;
tsheet.addEventListener('touchstart', e=>{
  if(!tsheet.classList.contains('show')) return;
  if(e.target.closest('button')) return;           // 버튼 위 터치는 제외
  sy = e.touches[0].clientY; dy=0; dragging=true; swiped=false;
  tsheet.style.transition='none';
}, {passive:true});
tsheet.addEventListener('touchmove', e=>{
  if(!dragging) return;
  e.preventDefault();                              // 배경 스크롤 차단
  dy = e.touches[0].clientY - sy;
  const mini = tsheet.classList.contains('mini');
  // 펼친 상태: 아래로만 / 접힌 상태: 위로만 따라오게
  const follow = mini ? Math.min(0, dy) : Math.max(0, dy);
  tsheet.style.transform = `translateY(${follow}px)`;
  if(Math.abs(dy)>8) swiped=true;
}, {passive:false});
function endDrag(){
  if(!dragging) return; dragging=false;
  tsheet.style.transition=''; tsheet.style.transform='';
  const mini = tsheet.classList.contains('mini');
  if(!mini && dy>60) tsheet.classList.add('mini');
  else if(mini && dy<-40) tsheet.classList.remove('mini');
  pinSheet();
  setTimeout(()=>{ swiped=false }, 50);          // 스와이프 직후 click 토글 방지
}
tsheet.addEventListener('touchend', endDrag);
tsheet.addEventListener('touchcancel', endDrag);

/* iOS: 키보드가 떴다 사라지면 fixed 요소가 제자리를 잃는 문제 보정
   visualViewport 기준으로 bottom 오프셋을 직접 계산해 항상 화면 하단에 붙임 */
function pinSheet(){
  const vv = window.visualViewport;
  if(!vv){ tsheet.style.bottom=''; return }
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);   // 키보드 등으로 가려진 높이
  const base = tsheet.classList.contains('mini') ? 14 : 0;
  tsheet.style.bottom = (kb + base) + 'px';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', pinSheet);
  window.visualViewport.addEventListener('scroll', pinSheet);
}
window.addEventListener('orientationchange', ()=>setTimeout(pinSheet,300));
// 입력칸 포커스 해제(키보드 닫힘) 직후에도 재고정
document.addEventListener('focusout', ()=>{ setTimeout(pinSheet,50); setTimeout(pinSheet,350) });
document.addEventListener('focusin', ()=>setTimeout(pinSheet,50));
pinSheet();
// 백그라운드 복귀 시 즉시 재계산 (화면 꺼짐/앱 전환 후에도 잔여시간 정확)
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && tEndAt && !tDone) tick();
});

/* ══════════ 날짜 + 주차 ══════════ */
const dateInput = document.getElementById('dateInput');
dateInput.value = curDate;
let dateManual = false;
dateInput.addEventListener('change', ()=>{ dateManual = true; curDate = dateInput.value || todayISO(); renderView() });

// 앱이 오래 열려 있다가 다시 보일 때: 사용자가 날짜를 직접 고른 게 아니면 오늘로 갱신
function refreshDateIfStale(){
  const today = todayISO();
  if(dateManual || curDate === today) return;
  curDate = today; dateInput.value = today;
  renderView(); renderWeek();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshDateIfStale() });
window.addEventListener('pageshow', refreshDateIfStale);
window.addEventListener('focus', refreshDateIfStale);

// 프로그램 1주차 시작일 = 2026-08-24. 이후 5주 훈련 + 1주 디로드 사이클 표시
const CYCLE_START = new Date('2026-08-31T00:00:00');  // 2026-11-15: 디로드 1주 순연 반영
function weekInfo(){
  const now = new Date(curDate+'T00:00:00');
  const diff = Math.floor((now - CYCLE_START)/(7*24*3600*1000));
  if(diff < 0) return '복귀 주간';
  const pos = diff % 6; // 0~4 훈련, 5 디로드
  return pos===5 ? '디로드 주 — 중량 60%, 세트 절반' : `사이클 ${Math.floor(diff/6)+1} · ${pos+1}주차`;
}
const weekChip = document.getElementById('weekChip');
const weekTxt = document.getElementById('weekTxt');
function renderWeek(){
  weekTxt.textContent = DELOAD.on ? '디로드 · 60%' : weekInfo();
  weekChip.classList.toggle('deload', DELOAD.on);
  weekChip.setAttribute('aria-pressed', DELOAD.on?'true':'false');
}
/* 앱 톤에 맞춘 확인 다이얼로그 — confirm() 대체. 반환: Promise<boolean> */
function askDialog({icon='!', tone='', title, body='', items=[], ok='확인', cancel='취소', okTone='primary'}){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='dlg-bg';
    bg.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <div class="ic ${tone}">${icon}</div>
      <h3 id="dlgT">${title}</h3>
      ${body?`<p>${body}</p>`:''}
      ${items.length?`<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`:''}
      <div class="acts"><button type="button" data-v="0">${cancel}</button><button type="button" class="${okTone}" data-v="1">${ok}</button></div>
    </div>`;
    document.body.appendChild(bg); requestAnimationFrame(()=>bg.classList.add('show'));
    const close=v=>{ bg.classList.remove('show'); setTimeout(()=>bg.remove(),200); res(!!v) };
    bg.querySelectorAll('button').forEach(b=>b.onclick=()=>close(+b.dataset.v));
    bg.addEventListener('click',e=>{ if(e.target===bg) close(0) });
    document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ close(0); document.removeEventListener('keydown',esc) } });
    setTimeout(()=>bg.querySelector('[data-v="1"]').focus(),60);
  });
}
weekChip.onclick = async ()=>{
  if(!DELOAD.on){
    const ok = await askDialog({ icon:'↓', title:'디로드 모드 켜기',
      body:'이번 주는 회복 주간입니다.',
      items:['중량은 이월 중량의 <b>60%</b> (2.5kg 단위)','세트 수는 <b>절반</b>','이월 중량 보존 · 증량 판정 쉼'],
      ok:'디로드 시작' });
    if(ok) setDeload(true);
  } else {
    const ok = await askDialog({ icon:'↑', tone:'green', title:'디로드 끝내기',
      body:'정상 중량과 세트로 돌아갑니다. 다음 세션부터 증량 판정이 다시 시작됩니다.',
      ok:'정상 복귀' });
    if(ok) setDeload(false);
  }
};
const elbowBtn = document.getElementById('elbowBtn');
elbowBtn.classList.toggle('on', ELBOW.on); elbowBtn.setAttribute('aria-pressed', ELBOW.on?'true':'false');
elbowBtn.onclick = async ()=>{
  if(!ELBOW.on){
    const ok = await askDialog({ icon:'🩹', tone:'red', title:'팔꿈치 모드 켜기',
      body:'외측상과염 보호 모드입니다. 손목 신전근과 강한 그립에 부하가 가는 종목을 걸러냅니다.',
      items:['사이드 레터럴 → <b>손목 커프</b> 버전으로 대체','푸시다운·스트레이트암·페이스풀·OH익스텐션 <b>제외</b>','풀업·로우·데드 <b>스트랩 + 80%</b>, 컬 <b>70%</b> — 증량 판정 쉼','기준: 통증 <b>3/10 이내</b>, 다음 날 더 아프면 중단'],
      ok:'모드 켜기', okTone:'danger' });
    if(ok) setElbow(true);
  } else {
    const ok = await askDialog({ icon:'✓', tone:'green', title:'팔꿈치 모드 끄기',
      body:'원래 종목 구성으로 돌아갑니다. 레터럴·푸시다운 등은 가벼운 중량부터 다시 시작하세요.',
      ok:'정상 복귀' });
    if(ok) setElbow(false);
  }
};
dateInput.addEventListener('change', renderWeek);

/* ══════════ 골프 샷 페이서 ══════════ */
(function(){
  const golf=document.getElementById('golf'), btn=document.getElementById('golfBtn'), xBtn=document.getElementById('golfClose');
  const cfgEl=document.getElementById('golfCfg'), gPer=document.getElementById('gPer'), gInt=document.getElementById('gInt'), gTotal=document.getElementById('gTotal');
  const gShot=document.getElementById('gShot'), gOf=document.getElementById('gOf'), gBig=document.getElementById('gBig'), gSub=document.getElementById('gSub'), gEl=document.getElementById('gElapsed');
  const bStart=document.getElementById('gStart'), bPause=document.getElementById('gPause'), bReset=document.getElementById('gReset');
  const KEY='cfg:golf';
  let cfg={per:100,total:100}; try{ Object.assign(cfg, JSON.parse(store.get(KEY)||'{}')) }catch(e){}
  let shots=0, nextAt=0, startedAt=0, pausedLeft=0, running=false, raf=null, lastSec=null, interval=36;
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  let ac=null;
  function beep(f,d,w=0){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.connect(g); g.connect(ac.destination); const t=ac.currentTime+w; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02) }catch(e){} }
  function renderCfg(){ interval=Math.round(3600/cfg.per); gPer.textContent=cfg.per; gInt.textContent=`${interval}초`; gTotal.textContent=cfg.total; gOf.textContent=cfg.total? ` / ${cfg.total}` : ''; }
  cfgEl.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, d=parseInt(b.dataset.d,10);
    if(k==='per') cfg.per=Math.max(30,Math.min(300,cfg.per+d));
    if(k==='total') cfg.total=Math.max(0,Math.min(500,cfg.total+d));
    store.set(KEY,JSON.stringify(cfg)); renderCfg();
  });
  function setBig(txt,cls){ gBig.textContent=txt; gBig.className='golf-big num'+(cls?' '+cls:''); golf.classList.remove('warn','go'); if(cls) golf.classList.add(cls); }
  function tick(){
    if(!running) return;
    const now=Date.now(), left=(nextAt-now)/1000, sec=Math.ceil(left);
    if(left<=0){
      shots++; gShot.textContent=shots;
      setBig('샷','go'); gSub.textContent=`${shots}번째 — 치세요`;
      beep(1320,.5); if(navigator.vibrate) navigator.vibrate(300);
      if(cfg.total && shots>=cfg.total){ running=false; gSub.textContent=`${cfg.total}개 완료 — 수고하셨습니다`; bPause.hidden=true; bStart.hidden=true; bReset.hidden=false; gEl.textContent=`총 ${fmt(Math.round((now-startedAt)/1000))}`; return }
      nextAt=now+interval*1000; lastSec=null;
      setTimeout(()=>{ if(running) tick() }, 1200); return;
    }
    if(sec!==lastSec){
      lastSec=sec;
      if(sec<=3){ setBig(String(sec),'warn'); gSub.textContent='준비'; beep(880,.08) }
      else { setBig(String(sec),''); gSub.textContent=`다음 샷까지`; }
    }
    gEl.textContent=`경과 ${fmt(Math.round((now-startedAt)/1000))}`;
    raf=requestAnimationFrame(tick);
  }
  bStart.onclick=()=>{
    if(!running && pausedLeft>0){ nextAt=Date.now()+pausedLeft; pausedLeft=0; }
    else { shots=0; gShot.textContent='0'; startedAt=Date.now(); nextAt=Date.now()+5000; }   // 첫 샷 5초 후
    running=true; lastSec=null; cfgEl.classList.add('lock');
    bStart.hidden=true; bPause.hidden=false; bReset.hidden=false; beep(660,.08);
    if(raf) cancelAnimationFrame(raf); tick();
  };
  bPause.onclick=()=>{ running=false; pausedLeft=Math.max(0,nextAt-Date.now()); if(raf) cancelAnimationFrame(raf); bPause.hidden=true; bStart.hidden=false; bStart.textContent='계속'; gSub.textContent='일시정지'; };
  bReset.onclick=()=>{ running=false; pausedLeft=0; shots=0; if(raf) cancelAnimationFrame(raf); gShot.textContent='0'; setBig('—',''); gSub.textContent='시작을 누르면 첫 샷까지 카운트다운'; gEl.textContent=''; cfgEl.classList.remove('lock'); bStart.hidden=false; bStart.textContent='시작'; bPause.hidden=true; bReset.hidden=true; };
  btn.onclick=()=>{ golf.hidden=false; renderCfg(); };
  xBtn.onclick=async()=>{ if(running && !(await askDialog({icon:'⛳',title:'페이서 닫기',body:'실행 중인 페이서를 멈추고 닫습니다.',ok:'닫기'}))) return; bReset.onclick(); golf.hidden=true; };
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && running){ lastSec=null; if(raf) cancelAnimationFrame(raf); tick() } });
  renderCfg();
})();

/* ══════════ 상단바 스크롤 상태 ══════════ */
const topbar=document.getElementById('topbar');
let tbTick=false;
/* 히스테리시스: 접힘 80px↑ / 펴짐 10px↓ — 간격(70px)이 날짜줄 높이(~58px)보다 커야
   접힘으로 생기는 스크롤 보정이 반대 기준을 넘지 못해 진동하지 않는다 */
function onScroll(){
  if(tbTick) return; tbTick=true;
  requestAnimationFrame(()=>{
    const y=window.scrollY, on=topbar.classList.contains('scrolled');
    if(!on && y>80) topbar.classList.add('scrolled');
    else if(on && y<10) topbar.classList.remove('scrolled');
    tbTick=false;
  });
}
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();

/* ══════════ 시작 ══════════ */
renderTabs(); renderView(); renderWeek();
</script>
